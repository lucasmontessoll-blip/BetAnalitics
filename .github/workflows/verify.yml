name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --outDir dist-web
      - run: npm run build:play -- --outDir dist-play
      - run: npm run verify:play -- dist-play
      - run: npm run quality -- dist-play
      - run: npm run release:manifest -- dist-play
