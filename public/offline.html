<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a10" />
  <title>BetAnalytics PRO — Sem conexão</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070a10;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 0%, rgba(37, 99, 235, 0.20), transparent 36%),
        radial-gradient(circle at 90% 100%, rgba(16, 185, 129, 0.10), transparent 34%),
        #070a10;
    }
    main {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      background: rgba(11, 14, 20, .94);
      box-shadow: 0 24px 70px rgba(0,0,0,.40);
      text-align: center;
    }
    .icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: rgba(37, 99, 235, .12);
      border: 1px solid rgba(96, 165, 250, .18);
      color: #93c5fd;
      font-size: 26px;
    }
    .eyebrow {
      margin: 0;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #60a5fa;
    }
    h1 {
      margin: 10px 0 0;
      font-size: 25px;
      line-height: 1.1;
    }
    p {
      margin: 12px 0 0;
      font-size: 13px;
      line-height: 1.65;
      color: #94a3b8;
    }
    button {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 16px;
      padding: 14px 18px;
      background: #fff;
      color: #07101f;
      font-weight: 900;
      cursor: pointer;
    }
    small {
      display: block;
      margin-top: 14px;
      color: #475569;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">↻</div>
    <p class="eyebrow">BetAnalytics PRO</p>
    <h1>Não foi possível carregar o aplicativo</h1>
    <p>
      Verifique sua conexão com a internet e tente novamente.
      O aplicativo precisa acessar a versão publicada no Render.
    </p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    <small>
      Caso o Render esteja publicando uma atualização, aguarde alguns instantes.
    </small>
  </main>
</body>
</html>
